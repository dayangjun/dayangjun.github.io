name: Refresh V2 receiver anti-alias build

on:
  push:
    branches:
      - v2-receiver-anti-alias-fix

permissions:
  contents: write

jobs:
  refresh_receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-receiver-anti-alias-fix

      - name: Gate one-shot refresh
        id: gate
        run: |
          if [ -f v2/assets/receiver.js ] &&
             grep -q 'completion-error' v2/assets/receiver.js &&
             grep -q 'K=' v2/assets/receiver.js; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tested V2 build
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fL 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-85b0-81f7-b069-c0cafee0dd11/raw?se=2026-09-18T13%3A30%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=94a9e67b-24c2-5d27-8b45-a445d44e8fe0&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T13%3A25%3A24Z&ske=2026-09-19T13%3A25%3A24Z&sks=b&skv=2026-02-06&sig=Lhxo8cme9s7K%2B3bRLnM4GcK6h9N4Hj9NUd1lb0wrLtc%3D' -o /tmp/v2.zip
          rm -rf /tmp/v2dist
          mkdir -p /tmp/v2dist
          unzip -q /tmp/v2.zip -d /tmp/v2dist

      - name: Refresh isolated receiver
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p v2/receiver v2/assets
          cp /tmp/v2dist/src/receiver/index.html v2/receiver/index.html
          cp /tmp/v2dist/assets/receiver.js v2/assets/receiver.js
          cp /tmp/v2dist/assets/receiver.css v2/assets/receiver.css
          cp /tmp/v2dist/assets/modulepreload-polyfill.js v2/assets/modulepreload-polyfill.js

          worker="$(find /tmp/v2dist/assets -maxdepth 1 -name 'decode.worker-*.js' -print -quit)"
          test -n "$worker"
          cp "$worker" v2/assets/decode.worker.js

          sed -i 's#../../assets/receiver.js#../assets/receiver.js#g' v2/receiver/index.html
          sed -i 's#../../assets/modulepreload-polyfill.js#../assets/modulepreload-polyfill.js#g' v2/receiver/index.html
          sed -i 's#../../assets/receiver.css#../assets/receiver.css#g' v2/receiver/index.html
          sed -E -i 's#decode\.worker-[A-Za-z0-9_-]+\.js#decode.worker.js#g' v2/assets/receiver.js
          sed -E -i 's#raptorqr_raptorq_wasm_bg-[A-Za-z0-9_-]+\.wasm#../../assets/raptorqr_raptorq_wasm_bg.wasm#g' v2/assets/decode.worker.js
          sed -E -i 's#zxing_reader-[A-Za-z0-9_-]+\.wasm#../../assets/zxing_reader.wasm#g' v2/assets/decode.worker.js

          grep -q 'completion-error' v2/assets/receiver.js
          grep -q 'K=' v2/assets/receiver.js
          grep -q 'benchmark-log' v2/receiver/index.html
          grep -q 'decode.worker.js' v2/assets/receiver.js

      - name: Commit refreshed preview
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2
          git commit -m "deploy: refresh V2 receiver anti-alias build"
          git push origin HEAD:v2-receiver-anti-alias-fix
