name: Refresh V2 receiver frame extraction

on:
  push:
    branches:
      - v2-receiver-frame-extraction-fix

permissions:
  contents: write

jobs:
  refresh_receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-receiver-frame-extraction-fix

      - name: Gate one-shot refresh
        id: gate
        run: |
          if [ -f v2/assets/receiver.js ] &&
             grep -q '取帧失败' v2/assets/receiver.js &&
             grep -q '取帧错' v2/assets/receiver.js; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tested V2 build
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fL 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-3afc-81fd-9611-29bde48e7ca6/raw?se=2026-09-18T13%3A46%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=776f0d27-d28b-5fbd-9f67-c51ad3bfb153&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T13%3A23%3A14Z&ske=2026-09-19T13%3A23%3A14Z&sks=b&skv=2026-02-06&sig=ZK6rl1Gv1A5DVXzkEuPNrC9FV95x7UxMxk9u4zh/YgA%3D' -o /tmp/v2.zip
          rm -rf /tmp/v2dist
          mkdir -p /tmp/v2dist
          unzip -q /tmp/v2.zip -d /tmp/v2dist

      - name: Refresh isolated receiver
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p v2/receiver v2/assets
          cp /tmp/v2dist/src/receiver/index.html v2/receiver/index.html
          cp /tmp/v2dist/assets/receiver.js v2/assets/receiver.js
          cp /tmp/v2dist/assets/receiver.css v2/assets/receiver.css
          cp /tmp/v2dist/assets/modulepreload-polyfill.js v2/assets/modulepreload-polyfill.js

          worker="$(find /tmp/v2dist/assets -maxdepth 1 -name 'decode.worker-*.js' -print -quit)"
          test -n "$worker"
          cp "$worker" v2/assets/decode.worker.js

          sed -i 's#../../assets/receiver.js#../assets/receiver.js#g' v2/receiver/index.html
          sed -i 's#../../assets/modulepreload-polyfill.js#../assets/modulepreload-polyfill.js#g' v2/receiver/index.html
          sed -i 's#../../assets/receiver.css#../assets/receiver.css#g' v2/receiver/index.html
          sed -E -i 's#decode\.worker-[A-Za-z0-9_-]+\.js#decode.worker.js#g' v2/assets/receiver.js
          sed -E -i 's#raptorqr_raptorq_wasm_bg-[A-Za-z0-9_-]+\.wasm#../../assets/raptorqr_raptorq_wasm_bg.wasm#g' v2/assets/decode.worker.js
          sed -E -i 's#zxing_reader-[A-Za-z0-9_-]+\.wasm#../../assets/zxing_reader.wasm#g' v2/assets/decode.worker.js

          grep -q '取帧失败' v2/assets/receiver.js
          grep -q '取帧错' v2/assets/receiver.js
          grep -q 'ready' v2/assets/decode.worker.js

      - name: Commit refreshed preview
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2
          git commit -m "deploy: refresh V2 receiver frame extraction fix"
          git push origin HEAD:v2-receiver-frame-extraction-fix
